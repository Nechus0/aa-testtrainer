<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testtrainer · Höherer Auswärtiger Dienst</title>
<meta name="description" content="Übungstool für den schriftlichen Teil des Auswahlverfahrens des Auswärtigen Amts">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Testtrainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="symbole/icon-192.png">
<style>
:root{
  --paper:#fff; --tint:#f5f6f7; --tint-2:#eceef0; --line:#d5d9de; --line-soft:#e6e9ec;
  --ink:#000; --text:#191919; --muted:#4f5661; --muted-2:#6b7581;
  --schwarz:#1c1c1c; --rot:#b3121b; --gold:#8a6d0b; --franz:#1a4b8c;
  --ok:#1c6f45; --ok-bg:#eef5f1; --bad:#b3121b; --bad-bg:#fbeeef;
  --k-recht:var(--schwarz); --k-geschichte:var(--rot); --k-wirtschaft:var(--gold);
  --k-franzoesisch:var(--franz);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --measure:820px; --kopf:74px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:17px/1.53 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--ink);font-weight:700;letter-spacing:-.015em}
h1{font-size:40px;line-height:1.14} h2{font-size:25px;line-height:1.22} h3{font-size:19px;line-height:1.3}
p{margin:0} button{font:inherit;cursor:pointer;color:inherit}
::selection{background:#ffe9a8}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right))}
.mute{color:var(--muted)} .small{font-size:14.5px;line-height:1.5} .xs{font-size:13px;line-height:1.45}
.tnum{font-variant-numeric:tabular-nums} .nowrap{white-space:nowrap}
.flag{display:flex;flex-direction:column;width:5px;height:34px;border-radius:1px;overflow:hidden;flex:none}
.flag i{flex:1} .flag i:nth-child(1){background:#000} .flag i:nth-child(2){background:#dd0000} .flag i:nth-child(3){background:#fc0}

/* Kopf */
header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:26px;height:var(--kopf)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand .t{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.brand .s{font-size:12.5px;color:var(--muted-2)}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav button{background:none;border:0;padding:26px 13px;font-size:15.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
@media (hover:hover){nav button:hover{color:var(--ink)}} nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

/* Klappmenü im Kopf */
.hd{position:relative}
nav button.mehr{display:inline-flex;align-items:center;gap:8px}
nav button.mehr .pfeil{font-size:10px;color:var(--muted-2);transition:transform .15s}
nav button.mehr.offen .pfeil{transform:rotate(180deg)}
nav button.mehr.offen{color:var(--ink)}
#navpop{display:none;position:absolute;right:0;top:100%;z-index:60;width:264px;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:6px}
#navpop.offen{display:block}
#navpop button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:12px 14px;
  border:0;border-radius:2px;background:none;font-size:15.5px;color:var(--text);margin:0}
@media (hover:hover){#navpop button:hover{background:var(--tint)}}
#navpop button.on{font-weight:700;color:var(--ink);background:var(--tint-2)}
#navpop button i{font-style:normal;margin-left:auto;font-size:12.5px;color:var(--muted-2);font-weight:400}
#navpop .kopfzeile{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);
  font-weight:700;padding:12px 14px 8px}
#navpop .trenner{height:1px;background:var(--line-soft);margin:6px 8px}

/* Seitenkopf */
/* Nur oben und unten setzen – die seitlichen Ränder (samt sicherem Bereich)
   kommen aus .wrap und würden von einer Kurzschreibweise gelöscht. */
.page{padding-top:56px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);margin-bottom:48px}
.eyebrow{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:14px}
.lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:640px;margin-top:16px}
/* Titel und Nebenangabe in einer Zeile – der Rubrikvorspann entfällt auf dem Telefon. */
.titelzeile{display:flex;align-items:baseline;gap:14px}
.titelzeile h1{flex:1 1 auto;min-width:0}
.titelzeile .kopfrechts{flex:none;font-size:13.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.seiten-zurueck{display:inline-flex;align-items:center;gap:8px;background:none;border:0;
  padding:0 0 12px;font-size:14px;color:var(--muted-2)}
.seiten-zurueck .zp{width:8px;height:8px;flex:none;border-left:1.8px solid #b6bcc4;
  border-bottom:1.8px solid #b6bcc4;transform:rotate(45deg)}
@media (hover:hover){.seiten-zurueck:hover{color:var(--ink)}}
.page .row{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-bottom:34px}
main{padding-bottom:110px} .view{display:none} .view.on{display:block}

.sec{margin-top:56px}
.sec-h{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.sec-h h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.sec-h .note{margin-left:auto;font-size:13.5px;color:var(--muted-2)}
.grid{display:grid;gap:20px} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.grid>*{min-width:0}
.tabelle{overflow-x:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:3px}
.card.pad{padding:26px 28px}
.kpi{padding:24px 26px 26px}
.kpi .lab{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.kpi .val{font-size:42px;line-height:1.05;font-weight:700;letter-spacing:-.035em;color:var(--ink);margin-top:12px;font-variant-numeric:tabular-nums}
.kpi .val span{font-size:19px;color:var(--muted-2);font-weight:400}
.kpi .sub{font-size:13.5px;color:var(--muted-2);margin-top:8px}
.cd{display:flex;align-items:baseline;gap:14px}
.cd .n{font-size:76px;line-height:.92;font-weight:700;letter-spacing:-.045em;color:var(--ink);font-variant-numeric:tabular-nums}
.cd .u{font-size:17px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 22px;border-radius:2px;font-size:16px;font-weight:700}
@media (hover:hover){.btn:hover{background:#2f2f2f;border-color:#2f2f2f}}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
@media (hover:hover){.btn.ghost:hover{background:var(--tint);border-color:var(--muted-2)}}
.btn.sm{padding:8px 15px;font-size:14px} .btn.blk{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.gefahr{color:var(--bad);border-color:var(--bad);background:var(--paper)}
@media (hover:hover){.btn.gefahr:hover{background:var(--bad-bg)}}
.link{background:none;border:0;padding:0;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:4px}

.k-recht{--kc:var(--k-recht)}.k-geschichte{--kc:var(--k-geschichte)}
.k-wirtschaft{--kc:var(--k-wirtschaft)}.k-franzoesisch{--kc:var(--k-franzoesisch)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kc,var(--muted))}
.tag::before{content:"";width:10px;height:10px;background:var(--kc,var(--muted));flex:none}
.tagrow{display:block;margin-bottom:8px}
.meter{height:4px;background:var(--tint-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--kc,var(--ink));transition:width .6s cubic-bezier(.2,.8,.2,1)}

table{width:100%;border-collapse:collapse;font-size:15.5px}
th{text-align:left;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:700;padding:0 14px 12px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
.empty{padding:48px 24px;text-align:center;color:var(--muted-2);font-size:15.5px}
.feld{display:flex;align-items:center;gap:14px;padding:15px 22px;border-bottom:1px solid var(--line-soft)}
.feld:last-child{border-bottom:0}
.feld .sq{width:11px;height:11px;flex:none;background:var(--kc,var(--muted))}
.feld .nm{flex:1;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feld .bar{width:96px;height:5px;background:var(--tint-2);flex:none;overflow:hidden}
.feld .bar i{display:block;height:100%;background:var(--kc,var(--ink))}
.feld .qt{width:52px;text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.feld .ct{width:52px;text-align:right;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;flex:none}
/* Lehrplanzeilen brauchen mehr Platz für „nicht bearbeitet“ – als Klasse, nicht
   als Inline-Maß, sonst kann die Telefonansicht sie nicht umbrechen lassen. */
.lp-zeile .qt{width:74px}
.lp-zeile .ct{width:96px}
.morerow{padding:14px 22px;border-top:1px solid var(--line-soft)}

/* Stand je Prüfungsteil */
.standkarte{display:flex;flex-direction:column}
.standkarte h3{font-size:17px;line-height:1.3;margin:14px 0 20px;min-height:44px}
.standkarte .quotezeile{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.standkarte .wert{font-size:36px;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.standkarte .leer{font-size:15px;color:var(--muted-2);line-height:44px}
.standkarte .trend{margin-left:auto;font-size:13.5px;white-space:nowrap}
.standkarte .zahlen{margin-top:16px}
.standkarte .fuss{margin-top:auto;padding-top:14px;color:var(--muted-2);line-height:1.4;
  border-top:1px solid var(--line-soft);margin-bottom:-2px}

/* Fragen des Tages */
.tagpost{display:flex;flex-direction:column;position:relative}
.tagpost.fertig{background:#fcfdfc;border-color:#cfe0d7}
.tagkopf{display:flex;align-items:center;gap:10px;min-height:22px}
.tagkopf .haken{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;
  font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.tagpost h3{min-height:44px}
.tagpost .btn{margin-top:auto}

/* Trainer: Segmentschalter, aufklappbare Einstellzeilen, Umfangskarte */
.segmente{display:flex;gap:4px;background:var(--tint-2);border-radius:12px;padding:4px;margin-bottom:20px}
.segmente .seg-btn{flex:1;min-height:42px;border:0;border-radius:9px;background:none;
  font-size:15.5px;font-weight:600;color:var(--muted);cursor:pointer}
.segmente .seg-btn.an{background:var(--paper);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.1)}

.grpliste{overflow:hidden;padding:0;margin-bottom:16px}
/* Kopf der Auswahlfenster im Trainer */
.wahlkopf{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.wahlkopf h2{flex:1;min-width:0;font-size:19px}
.grp-zeile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--line-soft);padding:16px 20px;min-height:58px;cursor:pointer}
@media (hover:hover){.grp-zeile:hover{background:var(--tint)}}
.grp-zeile .gl{flex:none;font-size:16px;color:var(--ink)}
.grp-zeile .gw{flex:1;min-width:0;text-align:right;font-size:15.5px;color:var(--muted-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-zeile .gp{flex:none;width:9px;height:9px;border-right:1.8px solid #b6bcc4;border-bottom:1.8px solid #b6bcc4;
  transform:rotate(-45deg)}
.grpliste > *:last-child{border-bottom:0}
.umfangkarte .tr-lab{margin-bottom:14px}

.tr-block{padding:0 0 28px;margin-bottom:28px;border-bottom:1px solid var(--line-soft)}
.tr-block:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:8px}
.tr-lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;
  margin-bottom:16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tr-lab span{letter-spacing:0;text-transform:none;font-weight:400;font-size:13px;color:var(--muted-2);margin-left:auto}
.chips{display:flex;flex-direction:column;gap:18px}
.chipgruppe{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* Gruppenschalter gehört neben die Überschrift, nicht ans Ende der Marken –
   sonst landet er neben einer beliebigen Marke der letzten Zeile. */
.chipkopf{flex:0 0 100%;display:flex;align-items:center;gap:12px}
.chiptitel{flex:1;min-width:0;font-size:13px;color:var(--muted-2)}
.chipkopf .chip.alle{flex:none;min-height:32px;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--paper);
  border-radius:2px;padding:10px 15px;font-size:15px;color:var(--text)}
.chip i{width:10px;height:10px;background:var(--kc,var(--muted));flex:none;opacity:.35}
.chip em{font-style:normal;font-size:12.5px;color:var(--muted-2)}
@media (hover:hover){.chip:hover{border-color:var(--muted-2)}}
.chip.an{border-color:var(--ink);background:var(--tint);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
.chip.an i{opacity:1}
.chip.alle{font-size:13.5px;color:var(--muted);border-style:dashed;padding:10px 13px}
.optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.optionen.zwei{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tr-opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:16px 18px;
  display:flex;flex-direction:column;gap:6px}
.tr-opt b{font-size:15.5px;color:var(--ink)}
.tr-opt span{font-size:13px;line-height:1.45;color:var(--muted)}
@media (hover:hover){.tr-opt:hover{border-color:var(--muted-2)}}
.tr-opt.an{border-color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ink)}
.umfang{display:flex;align-items:center;gap:20px}
.umfang input[type=range]{flex:1;width:auto;padding:0;border:0;background:none;accent-color:#000;height:24px}
.tr-zahl{flex:none;min-width:76px;text-align:right;font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.stufen{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stufe-btn{border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:7px 13px;
  font-size:13.5px;color:var(--muted)}
@media (hover:hover){.stufe-btn:hover{border-color:var(--muted-2);color:var(--ink)}}
.stufe-btn.an{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--tint)}
.tr-start{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:28px;padding-top:24px;
  border-top:1px solid var(--line)}
.tr-zusammen{flex:1;min-width:220px;font-size:15.5px;color:var(--muted)}
.tr-zusammen b{color:var(--ink)}
.tr-start .btn{padding:14px 30px;font-size:17px}

/* Tagespakete */
.paket{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line-soft)}
.paket:last-of-type{border-bottom:0}
.paket .pn{flex:0 0 132px;font-size:15.5px;font-weight:600;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.paket .pn em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ok);border:1px solid #c4ded1;background:var(--ok-bg);padding:2px 6px;border-radius:2px;margin-left:8px}
.paket .pt{display:flex;gap:18px;flex:0 1 auto;min-width:0;margin-right:auto}
.paket .pt>span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.paket .pp{width:9px;height:9px;background:var(--kc,var(--muted));flex:none}
.paket .pq{flex:0 0 52px;text-align:right;font-size:14.5px;font-weight:700;color:var(--ink)}
.paket .pb{flex:0 0 84px;height:5px;background:var(--tint-2);overflow:hidden}
.paket .pb i{display:block;height:100%;background:var(--ink)}
.paket .pa{flex:none}
.paket.neu{background:#fcfdfc}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.mode{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:26px 28px 24px;display:flex;flex-direction:column;min-height:174px;transition:border-color .13s,transform .13s}
@media (hover:hover){.mode:hover{border-color:var(--ink);transform:translateY(-2px)}}
.mode .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:11px}
.mode h3{margin-bottom:9px} .mode p{font-size:14.5px;line-height:1.5;color:var(--muted)}
.mode .meta{margin-top:auto;padding-top:18px;padding-right:38px;display:flex;gap:9px;flex-wrap:wrap}
.mode .meta em{font-style:normal;font-size:12.5px;color:var(--muted-2);border:1px solid var(--line-soft);padding:3px 9px;border-radius:2px}
.mode .go{position:absolute;right:26px;bottom:22px;font-size:20px;color:var(--line)}
@media (hover:hover){.mode:hover .go{color:var(--ink)}}
.banner{grid-column:1/-1;border-left:4px solid var(--ok);background:var(--ok-bg);padding:18px 22px;font-size:15.5px;border-radius:2px}

/* Prüfung */
.runwrap{max-width:var(--measure);margin:0 auto}
.exambar{position:sticky;top:var(--kopf);z-index:40;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:44px}
.exambar .in{max-width:var(--measure);margin:0 auto;padding:18px 0 16px;display:flex;align-items:center;gap:20px}
.exambar .who{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.exambar .what{font-size:18px;font-weight:700;color:var(--ink);margin-top:3px;letter-spacing:-.015em}
.timer{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.timer.warn{color:var(--bad)}
.timerlab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:700;text-align:right;margin-bottom:5px}
.trail{height:3px;background:var(--tint-2)} .trail i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qcard{padding:8px 0 0} .qcard.marked{border-left:5px solid var(--gold);padding-left:22px;margin-left:-27px}
.qhead{display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.markbtn{display:inline-flex;align-items:center;gap:7px}
.markbtn .mk-ic{font-size:15px;line-height:1}
.qnum{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.markhint{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.stem{font-size:25px;line-height:1.36;font-weight:700;color:var(--ink);letter-spacing:-.018em;margin-bottom:30px;max-width:740px}
.stem em{font-style:normal;border-bottom:3px solid var(--gold);padding-bottom:1px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:17px 20px;font-size:17px;line-height:1.45;color:var(--text)}
@media (hover:hover){.opt:hover{border-color:var(--ink);background:var(--tint)}}
.opt.sel{border-color:var(--ink);background:#edeff1;box-shadow:inset 0 0 0 1px var(--ink),inset 5px 0 0 var(--ink)}
.opt .ltr{flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;font-size:13.5px;font-weight:700;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.opt.sel .ltr{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok),inset 5px 0 0 var(--ok)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad),inset 5px 0 0 var(--bad)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.static{cursor:default}
@media (hover:hover){.opt.static:hover{border-color:var(--line);background:var(--paper)}}
@media (hover:hover){.opt.static.right:hover{border-color:var(--ok);background:var(--ok-bg)}}
@media (hover:hover){.opt.static.wrong:hover{border-color:var(--bad);background:var(--bad-bg)}}
.qfoot{display:flex;align-items:center;gap:14px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line-soft)}
.stand .st-kurz{display:none}
.zurueckbtn .zb-ic{display:none}
.navi{margin-top:40px;padding-top:24px;border-top:1px solid var(--line-soft)}
details.navi.lang>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted-2);font-weight:700}
details.navi.lang>summary::-webkit-details-marker{display:none}
details.navi.lang>summary::before{content:"▶ ";font-size:9px}
details.navi.lang[open]>summary::before{content:"▼ "}
@media (hover:hover){details.navi.lang>summary:hover{color:var(--ink)}}
.navi .lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:14px}
.pgrid{display:flex;gap:6px;flex-wrap:wrap}
.pg{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:2px;font-variant-numeric:tabular-nums}
@media (hover:hover){.pg:hover{border-color:var(--ink);color:var(--ink)}}
.pg.done{background:var(--ink);border-color:var(--ink);color:#fff}
.pg.mark{position:relative;border-color:var(--gold);background:#fdf4dd;color:var(--gold);font-weight:700}
.pg.mark.done{background:var(--ink);border-color:var(--gold);color:#fff}
.pg.mark::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:1.5px solid var(--paper)}
.pg.cur{outline:2px solid var(--ink);outline-offset:3px}
.pglegend{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted-2)}
.pglegend span{display:inline-flex;align-items:center;gap:8px}
.pglegend i{width:14px;height:14px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.pglegend i.d{background:var(--ink);border-color:var(--ink)}
.pglegend i.m{background:#fdf4dd;border-color:var(--gold)}
.pglegend i.c{outline:2px solid var(--ink);outline-offset:2px;margin:2px}
.artikel{border:1px solid var(--line);border-left:4px solid var(--franz);background:var(--tint);padding:24px 26px;margin-bottom:28px;border-radius:2px}
.artikel h4{font-size:17px;margin-bottom:14px}
.artikel p{font-size:16px;line-height:1.62;margin-bottom:12px}
.artikel p:last-of-type{margin-bottom:0}
.artikel .q{margin-top:16px;font-size:13px;color:var(--muted-2);text-align:right;font-style:italic}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.spec div{background:var(--paper);padding:20px 22px}
.spec .t{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.spec .v{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin-top:9px;font-variant-numeric:tabular-nums}
.spec .s{font-size:13.5px;color:var(--muted-2);margin-top:5px}
.verdict{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;padding:8px 16px;border-radius:2px;margin-top:14px}
.verdict.ja{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.verdict.nein{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.score{display:flex;align-items:center;gap:44px;padding:36px 34px;flex-wrap:wrap;margin-bottom:16px}
.scoretext{flex:1;min-width:240px}
.scorezahl{font-size:27px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.teilliste{margin-bottom:8px}
.teilliste .zeile{min-height:58px}
.teilliste .nm{font-size:15.5px;font-weight:400;color:var(--text)}
/* Abschlusstasten: auf dem Rechner am Seitenende, auf dem Telefon fest unten. */
.ergfuss{display:flex;gap:12px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line-soft)}
.ergfuss .btn{flex:1;min-height:52px}
.expl{margin-top:18px;border-left:4px solid var(--line);background:var(--tint);padding:18px 22px;font-size:15.5px;line-height:1.6}
.expl.ok{border-color:var(--ok);background:var(--ok-bg)} .expl.bad{border-color:var(--bad);background:var(--bad-bg)}
.rev{border:1px solid var(--line);border-radius:3px;margin-bottom:12px;background:var(--paper)}
.rev>summary{cursor:pointer;padding:18px 22px;display:flex;gap:16px;align-items:flex-start;font-size:16.5px;line-height:1.45;list-style:none}
.rev>summary::-webkit-details-marker{display:none}
.rev[open]>summary{border-bottom:1px solid var(--line-soft)}
.mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.mk.r{background:var(--ok)} .mk.w{background:var(--bad)} .mk.s{background:var(--muted-2)}
/* Punkt statt gefülltem Häkchen: gleiche Aussage, viel ruhigeres Listenbild. */
.mkp{flex:none;width:9px;height:9px;border-radius:50%;margin-top:8px}
.mkp.r{background:var(--ok)} .mkp.w{background:var(--bad)} .mkp.s{background:#cdd2d8}
/* Zwei Zeilen je Frage – sonst sind die Zeilen 105 bis 150 px hoch und die
   Liste wirkt unruhig. Die ganze Frage steht nach dem Aufklappen darunter. */
.revfrage{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-width:0;flex:1}
.rev[open] .revfrage{-webkit-line-clamp:unset;display:block}
.rev .body{padding:22px 22px 24px 47px}
.srcline{margin-top:14px;font-size:13px;color:var(--muted-2)}

input,select,textarea{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
label.fld{display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.legend{display:flex;gap:26px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);margin-top:20px}
.legend span{display:inline-flex;align-items:center;gap:9px}
.legend i{width:12px;height:12px;display:inline-block}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:14px 24px;border-radius:2px;font-size:15px;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%);opacity:1}
.hinweis{border-left:4px solid var(--gold);background:#fdf9ee;padding:14px 18px;font-size:14.5px;border-radius:2px;margin-bottom:20px}
.hinweis.fehler{border-color:var(--bad);background:var(--bad-bg)}
.hinweis.gut{border-color:var(--ok);background:var(--ok-bg)}

/* Anmeldung */
#anmeldung{display:none;min-height:100dvh;place-items:center;padding:32px max(20px,env(safe-area-inset-left)) 60px}
#anmeldung.on{display:grid}
.anmeldebox{width:100%;max-width:440px}
.anmeldebox .marke{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.anmeldebox h1{font-size:29px;margin-bottom:10px}
.anmeldebox form{display:flex;flex-direction:column;gap:18px;margin-top:26px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:28px 0 4px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 4px;margin-right:24px;font-size:15.5px;color:var(--muted)}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

/* Ladeanzeige */
#laden{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:200;transition:opacity .3s}
#laden.weg{opacity:0;pointer-events:none}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:dreh .7s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}

/* Quellen */
.quelle{display:flex;align-items:flex-start;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-soft)}
.quelle:last-child{border-bottom:0}
.quelle .t{flex:1 1 0;min-width:0;max-width:100%}
.quelle .t b{display:block;font-weight:600;font-size:15.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quelle .t .datei{display:block;font-size:12.5px;color:var(--muted-2);overflow-wrap:anywhere;margin-top:3px}
.quelle .akt{display:flex;gap:8px;flex:none}
.punkt{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
.punkt.ja{background:var(--ok)} .punkt.nein{background:#c4cad2}

/* Herkunft: Herausgeber und Einstufung */
.herkunft{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px}
.herkunft .geber{font-size:13.5px;font-weight:600;color:var(--text)}
.herkunft .fund{font-size:12.5px;color:var(--muted-2)}
.stufe{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 9px;border-radius:2px;border:1px solid;white-space:nowrap}
.stufe::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stufe.amtlich{color:#1c4f8a;border-color:#c3d5e8;background:#eef4fa}
.stufe.behoerde{color:var(--ok);border-color:#c4ded1;background:var(--ok-bg)}
.stufe.wissenschaft{color:#5c4a86;border-color:#d5cde8;background:#f2effa}
.stufe.kommerziell{color:var(--bad);border-color:#e8c7ca;background:var(--bad-bg)}
.stufe.sonstige{color:var(--muted);border-color:var(--line);background:var(--tint)}
.bezug{font-size:12px;color:var(--muted-2)}
.bezug.abseits{color:var(--gold);font-weight:600}
.quelle.abseits{background:#fbfbfc}
.quelle.abseits .t b{color:var(--muted);font-weight:500}

/* Aufklappbare Sachgebiete – ein zusammenhängender Block mit Trennlinien
   statt einzeln schwebender Karten, wie im Trainer und auf der Übersicht. */
.gebietblock{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  overflow:hidden;margin-bottom:14px}
.gebietblock .gebiet{border:0;border-radius:0;margin:0;background:none}
.gebietblock .gebiet+.gebiet{border-top:1px solid var(--line-soft)}
/* Innen keine Karte in der Karte: die Einträge sind Zeilen mit Trennlinie. */
.gebietblock .gebiet-inhalt{padding:0}
.gebietblock .gebiet .rev{border:0;border-radius:0;margin:0;background:none}
.gebietblock .gebiet .rev+.rev{border-top:1px solid var(--line-soft)}
.gebietblock .gebiet-mehr{border-top:1px solid var(--line-soft);padding:14px 20px}
/* Die Fragen rücken unter den Namen der Gruppe ein, nicht unter das Quadrat. */
.gebietblock .gebiet .rev>summary{padding-left:20px;padding-right:20px}
.gebietblock .gebiet .rev .body{padding-left:45px;padding-right:20px}
.gebiet{border:1px solid var(--line);border-radius:3px;margin-bottom:14px;background:var(--paper)}
/* Die Kopfzeile ist dieselbe Listenzeile wie auf der Übersicht und im
   Lehrplan: Farbquadrat, Name, Zusatzangabe darunter, Winkel rechts. */
.gebiet>summary{cursor:pointer;list-style:none}
.gebiet>summary::-webkit-details-marker{display:none}
@media (hover:hover){.gebiet>summary:hover{background:var(--tint)}}
.gebiet[open]>summary{border-bottom:1px solid var(--line-soft)}
.gebiet .gpfeil{flex:none;width:8px;height:8px;margin:0 0 0 2px;align-self:center;
  border-right:1.8px solid #b6bcc4;border-bottom:1.8px solid #b6bcc4;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.gebiet[open] .gpfeil{transform:rotate(-135deg) translate(-2px,-2px)}
.gebiet .fehlt{color:var(--gold);font-weight:700}
.gebiet .rev{margin-bottom:10px}
details.lp-auf{border-top:1px solid var(--line-soft)}
details.lp-auf>summary{cursor:pointer;list-style:none;padding:15px 22px;font-size:14.5px;color:var(--ink)}
details.lp-auf>summary::-webkit-details-marker{display:none}
details.lp-auf>summary::before{content:"▶ ";font-size:10px;color:var(--muted-2)}
details.lp-auf[open]>summary::before{content:"▼ "}
@media (hover:hover){details.lp-auf>summary:hover{background:var(--tint)}}

/* =====================================================================
   Bausteine aus dem Entwurf: gruppierte Listen in weißen Karten
   ===================================================================== */

.cdcard{display:flex;align-items:center;gap:18px;background:var(--schwarz);color:#fff;
  border-radius:14px;padding:20px 24px;margin-bottom:30px}

/* Hinweis auf einen Durchgang, der nicht zu Ende gebracht wurde */
.offenerlauf{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border:1px solid var(--gold);background:#fdf4dd;border-radius:14px;
  padding:16px 20px;margin:-14px 0 30px}
.offenerlauf .ol-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}
.offenerlauf .ol-text b{font-size:15.5px;color:#6b5200}
.offenerlauf .ol-text span{font-size:13px;color:#7d6317}
.offenerlauf .ol-akt{display:flex;gap:10px;flex:none}
.cdcard .n{font-size:52px;line-height:.95;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.cdcard .t{display:flex;flex-direction:column;gap:3px}
.cdcard .t b{font-size:16px;font-weight:600}
.cdcard .t i{font-style:normal;font-size:13.5px;color:rgba(255,255,255,.62)}

.card.liste{overflow:hidden;padding:0}
.liste .zeile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 20px;background:none;border:0;border-bottom:1px solid var(--line-soft);min-height:64px}
.liste .zeile:last-child{border-bottom:0}
button.zeile{cursor:pointer}
@media (hover:hover){button.zeile:hover{background:var(--tint)}}
.liste .pt{width:11px;height:11px;flex:none;background:var(--kc,var(--muted));align-self:flex-start;margin-top:5px}
.liste .mitte{flex:1;min-width:0;display:block}
/* Lange Namen dürfen umbrechen – aber höchstens auf zwei Zeilen, damit die
   Liste ihre gleichmäßige Höhe behält. */
.liste .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em;
  overflow:hidden;line-height:1.28}
.liste .sub{display:block;font-size:12.5px;color:var(--muted-2);margin-top:2px}
.liste .bar{display:block;height:3px;background:var(--tint-2);margin-top:8px;border-radius:2px;overflow:hidden;
  max-width:180px}
.liste .bar i{display:block;height:100%;background:var(--kc,var(--ink))}
.liste .wert{flex:none;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;
  min-width:56px;text-align:right}
.durchgangzeile .wert i{font-style:normal;font-weight:400;color:var(--muted-2)}

/* Abdeckung des Lehrplans: Kopfzahlen und Zeilen in derselben Listenform */
.lpkarte{overflow:hidden}
.lp-kopf3{padding:16px 20px 18px;border-bottom:1px solid var(--line)}
.lp-zurueck{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0 0 10px;
  font-size:13.5px;color:var(--muted-2)}
.lp-zurueck .zp{width:8px;height:8px;flex:none;border-left:1.8px solid #b6bcc4;border-bottom:1.8px solid #b6bcc4;
  transform:rotate(45deg)}
@media (hover:hover){.lp-zurueck:hover{color:var(--ink)}}
.lp-titel{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.lp-zeile2{font-size:13.5px;color:var(--muted-2);margin-top:4px;font-variant-numeric:tabular-nums}
.lp-abdeckung{display:flex;align-items:center;gap:12px;margin-top:14px}
.lp-balken{flex:1;min-width:0;height:6px;background:var(--tint-2);border-radius:3px;overflow:hidden}
.lp-balken i{display:block;height:100%;background:var(--ink)}
.lp-abdeckung span{flex:none;font-size:12.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.lpzeile .nm{-webkit-line-clamp:2}
.lpzeile .wert{min-width:52px}
/* Die Zahl rechts ist die Trefferquote, der Balken der Bearbeitungsstand –
   ohne das kleine Wort darunter liest man beide als dieselbe Größe. */
.lpzeile .wert em,.standzeile .wert em,.liste .wert em{display:block;font-style:normal;font-size:11px;
  font-weight:400;color:var(--muted-2);letter-spacing:.02em;margin-top:1px}
/* Kopfzeile einer Liste – dieselbe Form wie eine Zeile, nur ohne Ziel. */
.listenkopf{display:flex;align-items:baseline;gap:14px;padding:14px 20px;
  border-bottom:1px solid var(--line);font-size:15px;font-weight:700;color:var(--ink)}
.listenkopf span{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--muted-2);
  font-variant-numeric:tabular-nums}
/* Einzeilige Zeilen brauchen die volle Zeilenhöhe nicht. */
.dichtkarte{margin-bottom:22px}
.dichtkarte .zeile{min-height:52px;padding:11px 20px}
.dichtkarte .pt{align-self:center;margin-top:0}
.zeile .gp{flex:none;width:9px;height:9px;border-right:1.8px solid #b6bcc4;border-bottom:1.8px solid #b6bcc4;
  transform:rotate(-45deg);margin-left:2px}
.chip-start,.chip-fertig,.chip-stand{flex:none;display:inline-flex;align-items:center;justify-content:center;
  min-height:38px;padding:0 16px;border-radius:10px;font-size:14.5px;font-weight:700;white-space:nowrap}
.chip-start{background:var(--ink);color:#fff}
.chip-fertig{background:var(--ok-bg);color:var(--ok);border:1px solid #c4ded1}
.chip-stand{background:var(--tint);color:var(--muted);border:1px solid var(--line-soft);font-variant-numeric:tabular-nums}

/* Abdeckung des Lehrplans: Aufstieg über drei Ebenen statt einer langen Liste */
.lp-brot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}
.lp-brot span{color:var(--muted-2)}
.lp-brot b{color:var(--ink);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-brot .link{font-size:13.5px}
.feld.lp-zeile[data-lp-tiefer]{cursor:pointer}
@media (hover:hover){.feld.lp-zeile[data-lp-tiefer]:hover{background:var(--tint)}}
.feld .lp-pfeil{flex:none;width:18px;text-align:right;color:var(--muted-2);font-size:17px}
.feld.lp-kopf{flex-wrap:wrap;gap:4px 14px}
.feld.lp-kopf .nm{flex:1 1 auto;font-weight:600;color:var(--ink);font-size:16px;
  white-space:normal;overflow:visible;text-overflow:clip}
.feld.lp-kopf .uz{font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:normal}
.lp-frei{font-size:11.5px;color:var(--muted-2);border:1px solid var(--line);padding:1px 6px;
  border-radius:2px;margin-left:8px;white-space:nowrap}

/* Quellen aufnehmen */
.auf-wahl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border:1px dashed var(--line);padding:18px;border-radius:3px}
.auf-zeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);padding-bottom:12px}
.auf-zeile:last-child{border-bottom:0;padding-bottom:0}
.auf-titel{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:2px;
  padding:9px 11px;font:inherit;font-size:15px;background:var(--paper);color:var(--ink)}
.auf-titel:focus{outline:none;border-color:var(--ink)}
.auf-info{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Volltext einer Quelle nachlesen */
.tx-seite{white-space:pre-wrap;font-size:15px;line-height:1.62;color:var(--text);
  max-height:56vh;overflow:auto;border:1px solid var(--line);padding:18px 20px;
  background:var(--tint);border-radius:2px;overflow-wrap:anywhere}

/* Kontenliste */
.konto{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.konto:last-child{border-bottom:0}
.konto .wer{flex:1 1 210px;min-width:0}
.konto .wer b{display:block;font-size:16px;color:var(--ink)}
.konto .wer span{display:block;font-size:13px;color:var(--muted-2);overflow-wrap:anywhere}
.konto .wahl{display:flex;gap:10px;flex:none}
.konto .wahl label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted-2);font-weight:700}
.konto .wahl select{width:auto;min-width:132px;padding:8px 30px 8px 11px;font-size:14px}
.konto .zahlen{flex:none;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;min-width:118px}
.konto .akt{display:flex;gap:8px;flex:none;margin-left:auto;min-width:212px;justify-content:flex-end}

/* Einladungsliste */
.einladung{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.einladung:last-child{border-bottom:0}
.einladung .code{font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap}
.einladung .wem{flex:1 1 190px;min-width:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.einladung .akt{display:flex;gap:8px;flex:none;margin-left:auto}
.einladung.alt{opacity:.55}

@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  h1{font-size:32px} .cd .n{font-size:58px} .stem{font-size:21px}
  nav button{padding:24px 9px;font-size:14px} .brand .s{display:none}
  .wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  .page{padding-top:36px;margin-bottom:36px} .spec{grid-template-columns:1fr}
}
/* =====================================================================
   Testtrainer · Mobil (iPhone, Home-Bildschirm / Safari standalone)
   ---------------------------------------------------------------------
   Ersetzt den Block  @media(max-width:720px){ … }  am Ende von index.html.
   Der Block @media(max-width:980px){…} bleibt unverändert stehen.

   Ausgangslage: die App läuft nicht aus dem App Store, sondern als
   Verknüpfung auf dem Home-Bildschirm (display:standalone). Daraus folgt:
     · keine Adressleiste, keine Zurück-Wischgeste  -> jede Ansicht braucht
       einen sichtbaren Ausstieg (Tab-Leiste bzw. „Abbruch“ in der Prüfung)
     · Safe Areas oben (Dynamic Island) und unten (Home-Indikator)
     · kein Bounce/Overscroll, kein Zoom beim Tippen in Felder
   ===================================================================== */

/* ---------- 1 · Grundlagen für den Standalone-Betrieb ---------- */
@media(max-width:720px){
  html{
    -webkit-text-size-adjust:100%;
    height:-webkit-fill-available;   /* Safari-Adressleiste, falls doch im Browser */
  }
  body{
    font-size:16px;
    overscroll-behavior-y:none;      /* kein Gummiband über der Kopfzeile */
    -webkit-tap-highlight-color:transparent;
    text-rendering:optimizeLegibility;
  }
  button,.chip,.opt,.tr-opt,.pg,.stufe-btn,a{ touch-action:manipulation; }  /* kein Doppeltipp-Zoom */

  /* Eingabefelder nie unter 16px: sonst zoomt iOS beim Fokus hinein. */
  input,select,textarea{ font-size:16px; border-radius:11px; padding:14px 15px; }
  input[type=search]{ -webkit-appearance:none; }
  select{ -webkit-appearance:none; background-image:none; }

  /* Ränder folgen der Safe Area, nicht dem Displayrand. */
  .wrap{
    padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));
  }
}

/* ---------- 2 · Kopfzeile: großer Titel statt Menüband ---------- */
@media(max-width:720px){
  /* Gesamthöhe der Tab-Leiste einschließlich ihres eigenen unteren Randes.
     Wer Platz für sie freihalten will, rechnet nur noch mit dieser Zahl. */
  :root{ --kopf:0px;
         --tableiste: calc(57px + max(8px, env(safe-area-inset-bottom) - 14px)); }

  /* Der Bildschirm liegt auf Grau, die Inhalte stehen in weißen Karten –
     wie im Entwurf. Die Markenzeile entfällt; ihre Aufgabe übernimmt der
     große Seitentitel, der als Kopfzeile klebt. Kein backdrop-filter auf
     <header>: er erzeugte einen eigenen Bezugsrahmen und die fest
     verankerte Tab-Leiste klebte daran statt am Fensterrand. */
  body{ background:#f2f3f4 }
  /* Die Kopfzeile verschwindet optisch, bleibt aber im Fluss – sie trägt die
     <nav>, aus der unten die Tab-Leiste wird. Ein display:none nähme uns die
     Leiste mit; deshalb nur Höhe, Rahmen und Hintergrund entfernen. */
  header{
    position:static; background:none; border:0; box-shadow:none;
    height:0; overflow:visible; padding:0; margin:0;
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  header .hd{ display:block; padding:0; min-height:0 }
  header .brand{ display:none }

  .page{
    position:sticky; top:0; z-index:45;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--line-soft);
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-bottom:12px; margin-bottom:16px;
  }
  /* Kein Rubrikvorspann über dem Titel – nur der Titel, wie in einer App. */
  .page .eyebrow{ display:none }
  .page .titelzeile{ align-items:center; gap:11px }
  /* Flagge als Marke links neben dem Titel. */
  .page .titelzeile::before{
    content:""; width:5px; height:26px; flex:none; border-radius:1px;
    background:linear-gradient(#000 0 33.4%, #dd0000 33.4% 66.7%, #ffcc00 66.7% 100%);
  }
  .page .titelzeile .kopfrechts{ margin-left:auto }
  .page .seiten-zurueck{ padding:0 0 8px; font-size:13.5px }
  .page h1{ margin-top:0 }
  .page .lead{ display:none }
  .page .row{ padding-bottom:0; gap:0; display:block }
  .eyebrow{ font-size:11.5px; margin-bottom:8px; }
  h1{ font-size:30px; line-height:1.12; letter-spacing:-.028em; }
  h2{ font-size:19px; }
  .lead{ font-size:16px; line-height:1.5; margin-top:10px; }
  .cd{ gap:10px } .cd .n{ font-size:34px } .cd .u{ font-size:15px }
  .offenerlauf{ padding:14px 16px; gap:12px; margin:-16px 0 26px }
  .offenerlauf .ol-akt{ flex:1 1 100% }
  .offenerlauf .ol-akt .btn{ flex:1; min-height:46px; border-radius:11px }
}

/* ---------- 3 · Tab-Leiste unten (aus der vorhandenen <nav>) ----------
   Kein Markup-Umbau nötig: die fünf Schaltflächen in #nav – vier Ansichten
   plus „Verwaltung/Konto“ – werden zur festen Leiste am unteren Rand.     */
@media(max-width:720px){
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    width:auto; margin:0; gap:0;
    display:flex; overflow:visible;
    background:rgba(255,255,255,.93);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line-soft);
    /* Der Streifen unter den Beschriftungen war zu breit: die Safe Area am
       unteren Rand ist 34 Punkte hoch, davon braucht der Ziehbalken des
       iPhones nur etwa die Hälfte. Wie in der Systemleiste rücken die
       Beschriftungen deshalb näher an den Balken heran. */
    padding:6px max(4px,env(safe-area-inset-left)) max(8px, calc(env(safe-area-inset-bottom) - 14px));
  }
  nav button,
  nav button.mehr{
    flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    margin:0; padding:4px 2px; border:0; border-bottom:0;
    font-size:10.5px; line-height:1.15; letter-spacing:-.01em;
    color:var(--muted-2); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  /* Symbole als Strichzeichnung: Haus · Zielscheibe · Sprechblase · Person.
     Als Maske eingebunden, damit die Farbe dem Textzustand folgt. Die SVG-Adresse
     ist prozentkodiert – ein Semikolon in der Datenadresse bricht die Maske. */
  nav button::before{
    content:""; width:26px; height:26px; flex:none; background:currentColor; opacity:.72;
    -webkit-mask:var(--ic) center/25px 25px no-repeat; mask:var(--ic) center/25px 25px no-repeat;
  }
  nav button.on{ color:var(--ink); font-weight:700; border-bottom-color:transparent; }
  nav button.on::before{ opacity:1 }
  nav button[data-v=dash]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3.2%2011.2%2012%204l8.8%207.2%22%2F%3E%3Cpath%20d%3D%22M5.6%2010v9.9h12.8V10%22%2F%3E%3C%2Fsvg%3E")}
  nav button[data-v=train]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228.4%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223.3%22%2F%3E%3C%2Fsvg%3E")}
  nav button[data-v=fragen]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4.4%206.4h15.2v9.3h-8.7L6.7%2018.9v-3.2H4.4z%22%2F%3E%3Cpath%20d%3D%22M9.4%2010.9h5.2%22%2F%3E%3C%2Fsvg%3E")}
  nav button[data-v=mehr]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%228.4%22%20r%3D%223.6%22%2F%3E%3Cpath%20d%3D%22M5.4%2019.7c1.2-3.2%203.6-4.9%206.6-4.9s5.4%201.7%206.6%204.9%22%2F%3E%3C%2Fsvg%3E")}
  nav button.mehr .pfeil{ display:none; }

  /* Das Klappmenü öffnet nach oben, über der Leiste. */
  #navpop{
    position:fixed; bottom:var(--tableiste); top:auto;
    left:max(12px,env(safe-area-inset-left)); right:max(12px,env(safe-area-inset-right)); width:auto;
    border-radius:14px; box-shadow:0 -10px 40px rgba(0,0,0,.18); padding:8px;
  }
  #navpop button{ min-height:52px; border-radius:10px; padding:12px 14px; font-size:16px; }

  /* Platz für die Leiste am Seitenende. */
  main{ padding-bottom:calc(var(--tableiste) + 24px); }
}

/* ---------- 4 · Karten und Listen ---------- */
@media(max-width:720px){
  .sec{ margin-top:26px }
  /* Überschrift und Randnotiz bleiben auf einer Zeile – die Notiz weicht
     zurück, statt in eine zweite Zeile zu rutschen. */
  .sec-h{ padding-bottom:10px; margin-bottom:12px; border-bottom:0;
    flex-wrap:nowrap; gap:12px; align-items:baseline }
  .sec-h h2{ font-size:13px; flex:none }
  .sec-h .note{ font-size:12.5px; flex:1 1 auto; min-width:0; text-align:right;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

  .grid{ gap:10px }
  .g4{ grid-template-columns:repeat(2,1fr) }
  .g3,.g2{ grid-template-columns:1fr }
  /* „Letzte Durchgänge“ stand direkt unter dem Block darüber. */
  .g2{ row-gap:30px }

  .card{ border-radius:14px; border-color:var(--line-soft) }
  .card.pad{ padding:16px 18px }
  .kpi{ padding:14px 16px 15px }
  .kpi .lab{ font-size:11px }
  .kpi .val{ font-size:29px; margin-top:9px }
  .kpi .val span{ font-size:15px }
  .kpi .sub{ font-size:12px; margin-top:6px }

  /* Tagesaufgaben und Prüfungsteile als Liste, nicht als Kachelraster. */
  .standkarte h3{ min-height:0; margin:10px 0 14px; font-size:16px }
  .standkarte .wert{ font-size:30px }
  .tagpost h3{ min-height:0 }
  .tagpost .btn{ min-height:50px; border-radius:12px }

  .feld{ padding:13px 16px; gap:12px; min-height:56px }
  .feld .bar{ display:none }
  .feld .nm{ font-size:15.5px }
  /* Lehrplanzeilen zweizeilig: oben der Name, darunter Zahlen und Taste. */
  .feld.lp-zeile{ gap:5px 10px; flex-wrap:wrap; padding:12px 16px }
  .feld.lp-zeile .sq{ order:1 }
  /* Der Name bekommt die erste Zeile für sich – sonst quetscht er sich neben
     die Zahlen und bricht nach jedem einzelnen Wort um. */
  .feld.lp-zeile .nm{ order:2; flex:1 1 calc(100% - 46px); min-width:0; white-space:normal;
    overflow:visible; text-overflow:clip; line-height:1.35 }
  .feld.lp-zeile .lp-pfeil{ order:3 }
  .feld.lp-zeile .qt{ order:4; width:auto; margin-left:21px; font-size:14.5px }
  .feld.lp-zeile .ct{ order:5; width:auto; flex:1 1 auto; text-align:left; font-size:12.5px }
  .feld.lp-kopf .nm{ flex:1 1 100% }
  .lp-brot{ padding:12px 16px }
  .lp-kopf3{ padding:14px 18px 16px }
  .lp-titel{ font-size:18px }
  .lp-abdeckung{ flex-wrap:wrap; gap:8px 12px }
  .lp-abdeckung .lp-balken{ flex:1 1 100%; order:2 }
  .lp-abdeckung span{ order:1 }
  .paket{ padding:13px 16px; gap:10px; flex-wrap:wrap; min-height:56px }
  .paket .pn{ flex:1 1 auto } .paket .pb{ display:none }
  .paket .pt{ flex:1 1 100%; order:3; gap:14px; flex-wrap:wrap } .paket .pa{ order:2 }
  .modes{ grid-template-columns:1fr }
  .mode{ min-height:0; padding:18px 20px; border-radius:14px }
  .mode .go{ right:20px; bottom:18px }

  table{ font-size:14.5px } th,td{ padding-left:10px; padding-right:10px }
  .tabelle{ margin:0 -2px }
}

/* ---------- 5 · Trainer ---------- */
@media(max-width:720px){
  .tr-block{ padding-bottom:20px; margin-bottom:20px }
  .chip{ min-height:44px; padding:0 14px; border-radius:11px; font-size:15px }
  .optionen,.optionen.zwei{ grid-template-columns:1fr }
  .tr-opt{ padding:15px 16px; border-radius:12px; min-height:56px }
  .umfang{ gap:14px }
  .umfang input[type=range]{ height:34px }   /* größerer Griffbereich */
  .tr-zahl{ font-size:30px; min-width:62px }
  .stufe-btn{ min-height:40px; border-radius:10px; padding:0 16px }

  /* Startknopf klebt über der Tab-Leiste, immer erreichbar. */
  .tr-start{
    position:sticky; bottom:var(--tableiste);
    z-index:30; margin:22px -16px 0; padding:12px 16px 14px;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--line-soft); border-bottom:0; gap:8px;
  }
  .tr-start .btn{ order:1; width:100%; min-height:54px; border-radius:13px; font-size:17px; padding:0 }
  .tr-zusammen{ order:2; flex:1 1 100%; text-align:center; font-size:12.5px }

  .segmente{ margin-bottom:16px }
  .grp-zeile{ padding:15px 18px }
  .umfangkarte{ padding:16px 18px 18px }

  /* Dieselbe Logik im Bestand: die Auswahl bleibt startbar, ohne ans
     Ende einer womöglich sehr langen Liste zu scrollen. */
  /* Kennungen statt Klassen: die allgemeinen Regeln stehen weiter unten in
     der Datei und würden sonst gewinnen. */
  /* Die Markenzeile läuft bis an den Bildschirmrand – so ist erkennbar,
     dass sie sich schieben lässt, statt am Kartenrand abgeschnitten zu wirken. */
  #q-status{
    gap:8px; margin-bottom:24px;
    margin-left:calc(-1 * max(16px, env(safe-area-inset-left)));
    margin-right:calc(-1 * max(16px, env(safe-area-inset-right)));
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
  }
  #q-status button{ padding:11px 15px; font-size:14px; gap:6px }
  #q-status button em{ font-size:12px }
  /* Der Segmentschalter gehört zum Titel, Suche und Marken sind ein zweiter
     Block, die Liste ein dritter – dazwischen jeweils spürbar Luft. */
  #q-seg{ margin-bottom:26px }
  #q-pane-fragen .suchzeile{ min-height:50px; border-radius:12px; margin-bottom:14px }
  #q-zahl{ margin:0 2px 14px }
  #q-filter{ border-radius:12px; gap:12px; margin-bottom:22px }
  #q-filter .fld{ flex:1 1 100% }
}

/* ---------- 6 · Prüfung: eine Frage je Bildschirm ---------- */
@media(max-width:720px){
  /* Im Durchgang verschwindet die Tab-Leiste – Ausstieg nur über „Abbruch“.
     Dazu setzt app.js beim Start   document.body.classList.add('imLauf')
     und beim Verlassen  .remove('imLauf')  (siehe mobile-ios-snippets.html) */
  body.imLauf nav,
  body.imLauf #navpop{ display:none }
  body.imLauf header{ display:none }
  body.imLauf .exambar{ padding-top:env(safe-area-inset-top) }
  body.imLauf main{ padding-bottom:calc(96px + env(safe-area-inset-bottom)) }

  .exambar{
    top:0; margin-bottom:20px; padding-top:0;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
  }
  /* Wie im Entwurf: Abbruch links, Titel mittig, Uhr rechts. */
  .exambar .in{ padding:10px 16px; gap:10px; flex-wrap:nowrap; align-items:center }
  .exambar .in .kopfmitte{ order:2; flex:1 1 0!important; min-width:0; text-align:center }
  .exambar .in #abbruch{ order:1 }
  .exambar .in .kopfzeit{ order:3; flex:none; text-align:right }
  .exambar .who{ font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .exambar .what{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .exambar .in .btn{ margin-left:0; min-height:38px; border-radius:10px; padding:0 12px; font-size:14px }
  .timer{ font-size:22px } .timerlab{ display:none }
  .exambar .in .kopfzeit.small{ font-size:11.5px; white-space:nowrap; line-height:1.2 }

  /* Markieren wird zum reinen Stern – der Text braucht die Breite nicht. */
  .qhead .markbtn{ min-height:40px; min-width:40px; padding:0; border-radius:11px; font-size:17px }
  .qhead .markbtn .mk-txt{ display:none }

  .runwrap{ max-width:none }
  .qcard{ padding:0 }
  .qcard.marked{ margin-left:0; padding-left:12px }
  /* Eine Zeile: Marke · Zähler · Stern. Der Zähler weicht zurück. */
  .qhead{ gap:10px; margin-bottom:14px; flex-wrap:nowrap; align-items:center }
  .qhead .tag{ flex:none }
  .qnum{ font-size:12.5px; flex:1 1 auto; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap }
  .qhead .markhint{ display:none }
  .stem{ font-size:21px; line-height:1.36; margin-bottom:20px }

  /* Antwortflächen: volle Breite, mindestens 56 px hoch. */
  .opts{ gap:10px }
  .opt{ min-height:56px; padding:15px 16px; font-size:16.5px; gap:14px; border-radius:13px }
  .opt .ltr{ width:28px; height:28px }

  /* Fuß fest am unteren Rand: Zurück · Stand · Weiter. */
  .qfoot{
    position:fixed; left:0; right:0; bottom:0; z-index:45;
    margin:0; padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--line-soft); border-bottom:0;
    display:flex; align-items:center; gap:10px; flex-wrap:nowrap;
  }
  .qfoot .btn{ min-height:52px; border-radius:13px; padding:0 20px; flex:none }
  .qfoot .btn.ghost{ min-width:96px }
  /* Zurück wird zum Pfeilquadrat, der Stand zur Pille in der Mitte. */
  .qfoot .btn.ghost.zurueckbtn{ min-width:52px; width:52px; padding:0; font-size:22px; line-height:1 }
  .qfoot .zurueckbtn .zb-ic{ display:inline }
  .qfoot .zurueckbtn .zb-txt{ display:none }
  .qfoot .small{
    order:0; flex:1 1 auto; margin:0!important; text-align:center;
    font-size:12.5px; line-height:1.25;
  }
  .qfoot .stand{
    display:flex; align-items:center; justify-content:center; min-width:0;
    min-height:52px; border-radius:13px; border:1px solid var(--line-soft); background:var(--paper);
  }
  .qfoot .stand .st-lang{ display:none }
  .qfoot .stand .st-kurz{ display:block; text-align:center }
  .qfoot .stand .st-kurz b{ display:block; font-size:16px; color:var(--ink) }
  .qfoot .stand .st-kurz i{ display:block; font-style:normal; font-size:11.5px; color:var(--muted-2) }

  /* Sprungleiste unter der Kopfzeile: alle Fragen als Streifen, der
     Streifen führt die aktuelle Frage automatisch mittig nach.
     Markup dazu in mobile-ios-snippets.html, Abschnitt 4. */
  .sprung{
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; max-width:100%;
    -webkit-overflow-scrolling:touch; margin:0;
    padding:2px max(16px,env(safe-area-inset-right)) 9px max(16px,env(safe-area-inset-left));
  }
  .sprung::-webkit-scrollbar{ display:none }
  .sprung button{
    flex:none; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    font-size:14px; font-variant-numeric:tabular-nums;
    background:#fff; color:#9aa2ac; border:1px solid var(--line-soft);
  }
  .sprung button.done{ background:var(--tint-2); color:var(--text); border-color:#dfe2e6 }
  .sprung button.mark{ background:#fdf4dd; color:var(--gold); border-color:var(--gold); font-weight:700 }
  .sprung button.cur{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700 }
  .sprung button.cur.mark{ box-shadow:inset 0 -4px 0 var(--gold) }

  /* Im Fuß: Sprung zur nächsten Markierung, ohne Umweg über die Übersicht. */
  .qfoot .markenav{
    flex:none; min-height:52px; padding:0 12px; border-radius:13px; font-size:14.5px; font-weight:700;
    border:1px solid var(--gold); background:#fdf4dd; color:var(--gold);
  }
  .qfoot .markenav:disabled{ border-color:var(--line-soft); background:var(--tint); color:#c3c8ce; opacity:1 }

  /* Fragenübersicht eingeklappt, Ziele 44 px. */
  .navi{ margin-top:22px; padding-top:18px }
  .pgrid{ gap:8px }
  .pg{ width:44px; height:44px; font-size:14.5px; border-radius:10px }
  .pglegend{ gap:14px; font-size:12px }

  /* Lesetexte des Sprachtests: dürfen die Aufgabe nicht vom Bildschirm
     schieben. Der Text bekommt eine eigene Höhe mit eigenem Scroll und
     lässt sich ein-/ausklappen bzw. auf Lesehöhe vergrößern.
     app.js rendert den Text bereits als .artikel – hier nur die Hülle. */
  .artikel{
    padding:0; border-radius:12px; margin:14px 0 18px;
    border:1px solid var(--line); border-left:4px solid var(--franz); background:var(--tint);
    overflow:hidden;
  }
  /* Titelzeile ist der Schalter zum Ein- und Ausklappen. */
  .artikel .kopf{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    padding:13px 16px 11px; background:none; border:0; font:inherit;
  }
  .artikel .kopf span{ flex:1; min-width:0; font-size:15px; font-weight:700; color:var(--ink); line-height:1.3 }
  .artikel .kopf small{ display:block; font-size:11.5px; font-weight:400; color:var(--muted-2); margin-top:2px }
  .artikel .kopf .pfeil{ flex:none; font-style:normal; font-size:15px; color:#9aa2ac; transition:transform .15s }
  .artikel.zu .kopf .pfeil{ transform:rotate(180deg) }
  /* Vergrößern steht dort, wo der Text abbricht – nicht oben neben dem Titel. */
  .artikel .mehrlesen{
    width:100%; min-height:40px; border:0; border-top:1px solid var(--line-soft);
    background:var(--paper); font-size:13.5px; font-weight:600; color:var(--franz);
  }
  .artikel.zu .mehrlesen{ display:none }
  .artikel .text{                     /* Absätze in einen Rahmen mit eigenem Scroll */
    max-height:188px; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding:0 16px 14px;
    -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);
  }
  .artikel.voll .text{ max-height:460px; -webkit-mask-image:none }
  .artikel.zu .text{ display:none }
  .artikel p{ font-size:15.5px; line-height:1.62; margin-bottom:12px }
  .artikel .q{ font-size:12px; margin-top:0; padding:0 16px 12px }
  .artikel .schalter{
    margin-left:auto; display:flex; gap:8px; flex:none;
  }
  .artikel .schalter button{
    min-height:34px; padding:0 11px; border:1px solid var(--line); background:var(--paper);
    border-radius:9px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap;
  }
  .artikel .schalter button.lesen{ color:var(--franz) }

  /* Aufgabenstellungen des Sprachtests sind oft länger als im Fachtest. */
  .stem{ hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word }
  .opt span:last-child{ overflow-wrap:break-word; hyphens:auto; -webkit-hyphens:auto }
}

/* ---------- 7 · Ergebnis und Durchsicht ---------- */

  .score{ padding:20px 18px; gap:18px; justify-content:flex-start;

  /* „Mehr“ als zusammenhängende Liste statt einzelner Kacheln – eine Karte,

  #mehrgitter button.kachel::after{ content:""; position:absolute; right:20px; top:50%;
    width:9px; height:9px; border-right:1.8px solid #b6bcc4; border-bottom:1.8px solid #b6bcc4;

  #anmeldung{ padding:calc(24px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-left))

  .anmeldebox h1{ font-size:26px }
  .btn{ min-height:52px; border-radius:12px; padding:0 20px }
  .btn.sm{ min-height:40px; border-radius:10px; padding:0 14px }
  .btn.blk{ width:100% }
  .toast{
    left:16px; right:16px; bottom:calc(var(--tableiste) + 12px);

  .toast.on{ transform:none }
  .hinweis{ border-radius:0 10px 10px 0 }

  .konto{ padding:16px; gap:12px }

  .konto .wahl{ flex:1 1 100% } .konto .wahl label{ flex:1 } .konto .wahl select{ min-width:0; width:100% }
  .konto .zahlen{ min-width:0 }
  .einladung{ padding:14px 16px; gap:10px } .einladung .akt{ width:100%; margin-left:0; justify-content:flex-end }
  /* Quellenfilter: die drei Auswahlfelder nebeneinander statt untereinander,

/* =====================================================================
   Aus dem iPhone-Umbau übernommen – gilt auch am Schreibtisch
   ===================================================================== */
/* Statusfilter unter "Fragen" – dieselbe Bildsprache wie die Chips im Trainer */
/* Statusfilter: freistehende Marken, damit nicht zwei graue Wannen
   direkt übereinander stehen. Der Segmentschalter darüber bleibt die Wanne. */
.statusfilter{display:flex;gap:7px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.statusfilter::-webkit-scrollbar{display:none}
/* Die Hoehe kommt aus den Innenabstaenden, nicht aus min-height: bei
   align-items:baseline sitzt die Grundlinie sonst oben und der gesamte Rest
   der Mindesthoehe faellt nach unten - die Beschriftung klebt am Rand. */
.statusfilter button{flex:0 0 auto;display:inline-flex;align-items:baseline;justify-content:center;
  gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;
  padding:10px 15px;line-height:1.2;font-size:14.5px;color:var(--muted);white-space:nowrap}
.statusfilter button.an{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.statusfilter button em{font-style:normal;font-size:12px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.statusfilter button.an em{color:rgba(255,255,255,.72)}
@media (hover:hover){.statusfilter button:not(.an):hover{border-color:var(--ink);color:var(--ink)}}
/* Kompakte Suchzeile; die selteneren Filter liegen dahinter. */
/* Ein Suchfeld statt Feld plus gleich großem Knopf: der Filter sitzt darin. */
.suchzeile{display:flex;align-items:center;gap:10px;margin:0 0 14px;
  border:1px solid var(--line);border-radius:2px;background:var(--paper);padding:0 6px 0 12px}
.suchzeile:focus-within{border-color:var(--ink)}
.suchzeile input[type=search]{flex:1;min-width:0;border:0;background:none;
  padding:12px 0;font:inherit;font-size:16px;color:var(--ink)}
.suchzeile input[type=search]:focus{outline:none}
.suchzeile .such-lupe{flex:none;width:15px;height:15px;border:1.8px solid #a9b0b8;border-radius:50%;
  position:relative}
.suchzeile .such-lupe::after{content:"";position:absolute;right:-5px;bottom:-3px;width:6px;height:1.8px;
  background:#a9b0b8;transform:rotate(45deg)}
/* Drei Striche, die nach rechts kürzer werden – das übliche Filterzeichen. */
.such-filter{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:38px;height:38px;border:0;border-radius:9px;background:none;cursor:pointer}
.such-filter::before,.such-filter::after,.such-filter>span{content:"";display:block;height:1.8px;
  border-radius:1px;background:#7b838d}
.such-filter::before{width:15px} .such-filter>span{width:10px} .such-filter::after{width:5px}
.such-filter.an{background:var(--tint)}
.such-filter.an::before,.such-filter.an::after,.such-filter.an>span{background:var(--ink)}
@media (hover:hover){.such-filter:hover{background:var(--tint-2)}}
.filterbox[hidden]{display:none}
.filterbox{display:flex;gap:16px;align-items:end;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:2px;padding:16px;margin:0 0 18px}
.filterbox .fld{flex:1;min-width:150px}
.filterbox .link{flex:none;padding-bottom:12px}

.zahlzeile{font-size:14px;color:var(--muted-2);margin:0 2px 16px;font-variant-numeric:tabular-nums}
.zahlzeile[hidden]{display:none}
.zahlzeile b{color:var(--ink);font-weight:700}

/* "Mehr": Konto und Verwaltung auf einer Seite */
.mehrgitter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
@media(max-width:1200px){.mehrgitter{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.mehrgitter{grid-template-columns:1fr;gap:14px}}
.kachel{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:3px;padding:22px 24px;background:var(--paper)}
@media (hover:hover){.kachel:hover{border-color:var(--ink)}}
.kachel h3{font-size:18px}
.kachel p{font-size:14px;line-height:1.5;color:var(--muted)}
.kachel .zahl{font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;margin-top:4px}
.kachel h3 .ampel{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:9px;
  vertical-align:2px;background:var(--muted-2)}
.kachel h3 .ampel.gut{background:#1e7a3c}
.kachel h3 .ampel.warnung{background:var(--gold)}
.kachel h3 .ampel.offen{background:var(--muted-2)}

/* Gilt überall: Übersicht entfällt, wenn die Sprungleiste oben steht. */
.hat-sprung .navi{display:none}
.feld .ct,.gebiet .fehlt{white-space:nowrap}
.feld .ct.fehler::before{content:"✕";font-size:10.5px;color:var(--muted-2);opacity:.7;
  margin-right:5px;vertical-align:1px;font-variant-numeric:normal}

@media(min-width:721px){

  /* Sprungleiste in der Prüfung */
  .sprung{display:flex;gap:5px;flex-wrap:wrap;align-items:center;
    max-width:var(--measure);margin:0 auto;padding:12px 32px 14px}
  .sprung button{width:30px;height:30px;border-radius:2px;display:grid;place-items:center;
    font-size:12.5px;font-variant-numeric:tabular-nums;
    background:var(--paper);color:var(--muted-2);border:1px solid var(--line-soft)}
  @media (hover:hover){.sprung button:hover{border-color:var(--ink);color:var(--ink)}}
  .sprung button.done{background:var(--tint-2);color:var(--text);border-color:#dfe2e6}
  .sprung button.mark{background:#fdf4dd;color:var(--gold);border-color:var(--gold);font-weight:700}
  .sprung button.cur{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
  .sprung button.cur.mark{box-shadow:inset 0 -3px 0 var(--gold)}
  .markenav{height:38px;padding:0 13px;border-radius:2px;font-size:14px;font-weight:700;
    border:1px solid var(--gold);background:#fdf4dd;color:var(--gold);flex:none}
  .markenav:disabled{border-color:var(--line-soft);background:var(--tint);color:#c3c8ce;opacity:1;cursor:default}
  /* Steht die Leiste oben, entfällt die Übersicht am Seitenende. */

  /* Handlungstaste des Trainers bleibt sichtbar */
  .tr-start{position:sticky;bottom:0;z-index:20;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
    margin:22px 0 0;padding:16px 0;border-top:1px solid var(--line)}

  /* Lesetext mit eigenem Scrollbereich statt endloser Textwand */
  .artikel .kopf{width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    padding:16px 24px 12px;background:none;border:0;font:inherit}
  .artikel .kopf span{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3}
  .artikel .kopf small{display:block;font-size:12.5px;font-weight:400;color:var(--muted-2);margin-top:3px}
  .artikel .kopf .pfeil{flex:none;font-style:normal;font-size:15px;color:#9aa2ac;transition:transform .15s}
  .artikel .kopf.statisch{cursor:default;padding-bottom:6px}
  .artikel.zu .kopf .pfeil{transform:rotate(180deg)}
  .artikel{padding:0}
  .artikel .text{max-height:340px;overflow-y:auto;overscroll-behavior:contain;padding:0 24px 18px}
  .artikel.voll .text{max-height:none}
  .artikel.zu .text{display:none}
  .artikel .mehrlesen{width:100%;min-height:40px;border:0;border-top:1px solid var(--line-soft);
    background:var(--paper);font-size:13.5px;font-weight:600;color:var(--franz)}
  .artikel.zu .mehrlesen{display:none}
  .artikel .q{padding:0;margin-top:12px}

  /* Ruhigere Listen */
  .feld,.paket,.quelle,.einladung{min-height:56px}
  @media (hover:hover){.feld:hover,.paket:hover,.quelle:hover{background:#fafbfb}}
  .feld .qt,.feld .ct,.paket .pq,.kpi .val,.standkarte .wert{font-variant-numeric:tabular-nums}

  /* Antwortflächen ganzflächig treffen */
  .opt{min-height:56px;align-items:center}
  .opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .opt .ltr{transition:background .12s,color .12s}

  /* Fehlerzahl: Kreuz klein und grau davor statt groß dahinter */

  /* Breite Bildschirme wirklich nutzen */
  @media(min-width:1400px){
    .wrap{max-width:1440px;padding-left:40px;padding-right:40px}
    .lead,.stem{max-width:740px}
    .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
}

@media print{header,nav,.qfoot,.exambar,.navi,.sprung{display:none}}

/* ---------- Pop-ups: Johann und der Endspurt ----------
   Drei Einblendungen ueber der ganzen Seite. Aufbau immer gleich: Bild,
   Schwarz-Rot-Gold als Trennstrich, Text, zwei Faktenzeilen, ein Knopf.
   Der Endspurt bekommt ein flacheres Bild ("flach"), damit der Schriftzug
   "Auswaertiges Amt" in voller Breite lesbar bleibt. */
body.popOffen{overflow:hidden}
.pop-dim{position:fixed;inset:0;z-index:150;background:rgba(16,18,21,.62);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:popEin .18s ease-out}
@keyframes popEin{from{opacity:0}to{opacity:1}}
.pop{width:100%;max-width:360px;max-height:100%;overflow:auto;background:var(--paper);
  border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.34);position:relative;
  animation:popAuf .2s cubic-bezier(.2,.8,.3,1)}
@keyframes popAuf{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.pop .pop-zu{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border:0;
  border-radius:50%;background:rgba(20,22,26,.5);color:#fff;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.pop figure{position:relative;height:330px;overflow:hidden;background:#0d1013;margin:0}
/* Laedt das Bild nicht (Netz, Zwischenspeicher, noch nicht ausgeliefert),
   faellt es samt Rahmen weg – sonst klaffte oben ein schwarzes Feld. */
.pop.ohneBild figure{display:none}
.pop.ohneBild .pop-inhalt{padding-top:26px}
.pop.flach figure{height:238px}
.pop figure img{width:100%;height:100%;object-fit:cover;display:block}
.pop .flagge{height:3px;display:flex}
.pop .flagge i{flex:1}
.pop .flagge i:nth-child(1){background:#1c1c1c}
.pop .flagge i:nth-child(2){background:var(--rot)}
.pop .flagge i:nth-child(3){background:var(--gold)}
.pop .pop-inhalt{padding:20px 22px 18px}
.pop .pop-kicker{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;margin-bottom:10px}
.pop .pop-satz{font-size:20px;line-height:1.3;font-weight:700;color:var(--ink);
  letter-spacing:-.012em;margin-bottom:11px}
.pop .pop-unter{font-size:14.5px;line-height:1.55;color:var(--muted);margin-bottom:16px}
.pop .pop-fakten{border:1px solid var(--line-soft);border-radius:12px;background:var(--tint);
  padding:1px 16px;margin-bottom:16px}
.pop .pop-zeile{display:flex;align-items:baseline;gap:14px;padding:9px 0}
.pop .pop-zeile+.pop-zeile{border-top:1px solid var(--line-soft)}
.pop .pop-zeile span{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted-2);font-weight:700;flex:none;max-width:130px}
.pop .pop-zeile strong{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;
  margin-left:auto;text-align:right}
.pop .pop-zeile strong em{font-style:normal;display:block;font-size:12.5px;font-weight:400;
  color:var(--muted-2);margin-top:2px}
.pop .pop-fuss{text-align:center;font-size:12px;color:var(--muted-2);margin-top:9px}
@media (min-width:721px){
  .pop{max-width:520px;border-radius:4px}
  .pop figure{height:392px}
  .pop.flach figure{height:346px}
  .pop .pop-zu{top:14px;right:14px}
  .pop .pop-inhalt{padding:24px 34px 22px}
  .pop .pop-satz{font-size:24px}
  .pop .pop-fakten{border-radius:3px}
}
@media (prefers-reduced-motion:reduce){ .pop-dim,.pop{animation:none} }

/* Liste der Anzeigen, nur fuer Administratoren. */
/* Dieselbe Listenform wie ueberall: Name, darunter Zeitpunkt und Anlass.
   Die Art steht als Marke hinter dem Namen, nicht als eigene Spalte -
   auf dem Telefon brach die Spaltenfassung in vier Zeilen um. */
.pop-log{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.pop-log .marke{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  margin-left:9px;white-space:nowrap}
.pop-log .nm{-webkit-line-clamp:2}
.pop-log .ctx{margin-top:1px}
</style>
</head>
